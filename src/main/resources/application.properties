spring.application.name=hulton-hotels

# Used when the app is not started through Spring Boot's Docker Compose support
# (e.g. `docker compose up -d` then `java -jar`). When docker-compose.yml is picked up
# automatically, the connection details come from the mysql service instead.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/project}
spring.datasource.username=${DB_USERNAME:hulton}
spring.datasource.password=${DB_PASSWORD:hulton}

# The schema is managed by Flyway (db/migration), not Hibernate.
spring.jpa.hibernate.ddl-auto=none
# Keep the column names used in @Column exactly as written (e.g. HotelID, Room_no).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# db/migration holds the schema; db/sample adds demo hotels, rooms, guests and reviews.
# Leave db/sample out for a database that should start empty.
spring.flyway.locations=classpath:db/migration,classpath:db/sample
# On startup, give any hotel without rooms the standard four floors of rooms (see RoomLayout).
hulton.rooms.seed-empty-hotels=true
# Databases created before Flyway was added already have the V1 tables, so mark them as at V1.
spring.flyway.baseline-on-migrate=true

# Hotel and room photos, stored in the minio service from docker-compose.yml.
hulton.images.endpoint=${MINIO_URL:http://localhost:9000}
hulton.images.access-key=${MINIO_ACCESS_KEY:hulton}
hulton.images.secret-key=${MINIO_SECRET_KEY:hulton-secret}
hulton.images.bucket=hulton-images
# Upload src/main/resources/sample-images on startup (matches the db/sample data).
hulton.images.seed-samples=true

# Keep the session ID out of URLs.
server.servlet.session.tracking-modes=cookie

# Fingerprint static files (/css/app-<hash>.css) so browsers fetch the new version after a change.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
