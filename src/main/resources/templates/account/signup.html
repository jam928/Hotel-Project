<!DOCTYPE html>
<html lang="en" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body class="flex min-h-full flex-col bg-slate-50 font-sans text-slate-800 antialiased">
<header th:replace="~{fragments/layout :: nav('')}"></header>

<main class="w-full flex-1 mx-auto max-w-xl px-4 py-12">
	<div class="card p-8">
		<h1 class="text-2xl font-semibold text-slate-900">Create your account</h1>
		<p class="mt-1 text-sm text-slate-500">
			Already have one? <a th:href="@{/login(next=${next})}" class="link">Sign in</a>
		</p>
		<form th:action="@{/signup}" th:object="${form}" method="post" class="mt-6 grid gap-4 sm:grid-cols-2" novalidate>
			<input th:if="${next}" type="hidden" name="next" th:value="${next}">
			<div class="sm:col-span-2" th:insert="~{fragments/layout :: field('name', 'Full name', 'text', 'Jane Doe', 'name')}"></div>
			<div class="sm:col-span-2" th:insert="~{fragments/layout :: field('address', 'Address', 'text', '1 Main St', 'street-address')}"></div>
			<div th:insert="~{fragments/layout :: field('phone', 'Phone number', 'tel', '555-555-5555', 'tel')}"></div>
			<div th:insert="~{fragments/layout :: field('email', 'Email', 'email', 'you@example.com', 'email')}"></div>
			<div class="sm:col-span-2" th:insert="~{fragments/layout :: field('password', 'Password', 'password', '', 'new-password')}"></div>
			<div class="sm:col-span-2">
				<button type="submit" class="btn-primary w-full">Create account</button>
			</div>
		</form>
	</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
