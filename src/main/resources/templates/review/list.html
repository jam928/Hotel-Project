<!DOCTYPE html>
<html lang="en" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${kind.title()})}"></head>
<body class="flex min-h-full flex-col bg-slate-50 font-sans text-slate-800 antialiased">
<header th:replace="~{fragments/layout :: nav('reviews')}"></header>
<div th:replace="~{fragments/layout :: notice}"></div>

<main class="w-full flex-1 mx-auto max-w-3xl px-4 py-10">
	<a th:href="@{/review/history}" class="link text-sm">← All reviewable items</a>
	<div class="mt-3 flex flex-wrap items-end justify-between gap-4">
		<div>
			<h1 class="text-3xl font-bold tracking-tight text-slate-900" th:text="${kind.title()}">Reviews</h1>
			<p class="mt-2 text-slate-600"
				th:text="${kind.label() == 'room'} ? |Room ${item} at hotel ${hotelid}| : |${item} at hotel ${hotelid}|">Item</p>
		</div>
		<a th:href="@{/review/{kind}/new(kind=${kind.label()},item=${item},hotelid=${hotelid})}" class="btn-primary">Write a review</a>
	</div>

	<div th:if="${#lists.isEmpty(comments)}" class="card mt-8 text-center">
		<p class="font-medium text-slate-900">You haven't reviewed this yet</p>
		<p class="mt-1 text-sm text-slate-500">Tell us how it went. It only takes a minute.</p>
	</div>
	<ul th:unless="${#lists.isEmpty(comments)}" class="mt-8 space-y-4">
		<li th:each="comment : ${comments}" class="card">
			<p class="whitespace-pre-line text-slate-700" th:text="${comment}">Comment</p>
		</li>
	</ul>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
