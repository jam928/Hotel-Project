<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|${title} · Hulton Hotels|">Hulton Hotels</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<!--/* Runs before first paint so the page never flashes the wrong theme. A saved choice wins;
	       otherwise the OS setting is followed, including when it changes. */-->
	<script>
		(() => {
			const media = matchMedia('(prefers-color-scheme: dark)');
			const saved = () => { try { return localStorage.getItem('theme'); } catch { return null; } };
			const apply = (theme) => {
				document.documentElement.dataset.theme = theme;
				document.querySelectorAll('[data-theme-toggle]').forEach((button) => {
					button.setAttribute('aria-pressed', theme === 'dark');
				});
			};
			apply(saved() ?? (media.matches ? 'dark' : 'light'));
			media.addEventListener('change', (e) => { if (!saved()) apply(e.matches ? 'dark' : 'light'); });
			document.addEventListener('DOMContentLoaded', () => apply(document.documentElement.dataset.theme));
			document.addEventListener('click', (e) => {
				if (!e.target.closest('[data-theme-toggle]')) return;
				const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
				try { localStorage.setItem('theme', next); } catch {}
				apply(next);
			});
		})();
	</script>
</head>

<body>

<header th:fragment="nav(active)" class="sticky top-0 z-20 border-b border-slate-200 bg-surface/90 backdrop-blur">
	<div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
		<a th:href="@{/}" class="flex items-center gap-2 font-semibold text-slate-900">
			<span class="grid size-8 place-items-center rounded-lg bg-brand-600 text-sm font-bold text-white">H</span>
			Hulton Hotels
		</a>
		<nav aria-label="Main"
			class="order-last -mx-1 flex w-full gap-1 overflow-x-auto text-sm md:order-none md:mx-0 md:w-auto">
			<a th:href="@{/hotels}" class="rounded-md px-3 py-2 font-medium whitespace-nowrap"
				th:classappend="${active == 'hotels'} ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'">Find a hotel</a>
			<th:block th:if="${customerName}">
			<a th:href="@{/welcome}" class="rounded-md px-3 py-2 font-medium whitespace-nowrap"
				th:classappend="${active == 'home'} ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'">Dashboard</a>
			<a th:href="@{/reservations}" class="rounded-md px-3 py-2 font-medium whitespace-nowrap"
				th:classappend="${active == 'reservations'} ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'">My reservations</a>
			<a th:href="@{/review/history}" class="rounded-md px-3 py-2 font-medium whitespace-nowrap"
				th:classappend="${active == 'reviews'} ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'">Reviews</a>
			<a th:href="@{/account/edit}" class="rounded-md px-3 py-2 font-medium whitespace-nowrap"
				th:classappend="${active == 'account'} ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'">Account</a>
			</th:block>
		</nav>
		<div class="ml-auto flex items-center gap-2 text-sm">
			<button type="button" data-theme-toggle aria-pressed="false" aria-label="Dark mode" title="Toggle dark mode"
				class="grid size-9 place-items-center rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">
				<svg class="size-5 dark:hidden" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7.455 2.004a.75.75 0 0 1 .26.77 7 7 0 0 0 9.958 7.967.75.75 0 0 1 1.067.853A8.5 8.5 0 1 1 6.647 1.921a.75.75 0 0 1 .808.083Z" clip-rule="evenodd"/></svg>
				<svg class="hidden size-5 dark:block" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 14a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0-12a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 13a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1Zm8-5a1 1 0 0 1-1 1h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1ZM5 10a1 1 0 0 1-1 1H3a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1Zm10-5a1 1 0 0 1 0 1.4l-.7.7a1 1 0 1 1-1.4-1.4l.7-.7A1 1 0 0 1 15 5ZM7.1 12.9a1 1 0 0 1 0 1.4l-.7.7A1 1 0 1 1 5 13.6l.7-.7a1 1 0 0 1 1.4 0ZM15 15a1 1 0 0 1-1.4 0l-.7-.7a1 1 0 1 1 1.4-1.4l.7.7A1 1 0 0 1 15 15ZM7.1 7.1a1 1 0 0 1-1.4 0L5 6.4A1 1 0 1 1 6.4 5l.7.7a1 1 0 0 1 0 1.4Z"/></svg>
			</button>
			<a th:href="@{/statistics}" class="rounded-md px-3 py-2 font-medium whitespace-nowrap"
				th:classappend="${active == 'admin'} ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'">Admin</a>
			<form th:if="${customerName}" th:action="@{/logout}" method="post">
				<button type="submit" class="btn-secondary">Log out</button>
			</form>
			<a th:unless="${customerName}" th:href="@{/login}" class="btn-primary">Sign in</a>
		</div>
	</div>
</header>

<!--/* Flash messages: "notice" for success, "warning" when something needs another try. */-->
<div th:fragment="notice" th:if="${notice} or ${warning}" class="mx-auto max-w-6xl px-4 pt-6">
	<div th:if="${notice}" role="status" class="flex items-start gap-3 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800 dark:border-emerald-900/60 dark:bg-emerald-950/40 dark:text-emerald-300">
		<svg class="mt-0.5 size-4 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-8 8a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L8 12.6l7.3-7.3a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>
		<span th:text="${notice}">Saved.</span>
	</div>
	<div th:if="${warning}" role="alert" class="flex items-start gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800 dark:border-amber-900/60 dark:bg-amber-950/40 dark:text-amber-300">
		<svg class="mt-0.5 size-4 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8.5 2.9a1.7 1.7 0 0 1 3 0l6.3 11.4A1.7 1.7 0 0 1 16.3 17H3.7a1.7 1.7 0 0 1-1.5-2.7L8.5 2.9ZM10 7a1 1 0 0 0-1 1v3a1 1 0 1 0 2 0V8a1 1 0 0 0-1-1Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/></svg>
		<span th:text="${warning}">Try again.</span>
	</div>
</div>

<!--/* A labelled input bound to a property of the enclosing th:object form. */-->
<div th:fragment="field(name, label, type, placeholder, autocomplete)">
	<label class="label" th:for="${name}" th:text="${label}">Label</label>
	<input class="input" th:type="${type}" th:field="*{__${name}__}" th:placeholder="${placeholder}"
		th:attr="autocomplete=${autocomplete}" th:errorclass="input-error">
	<p class="field-error" th:if="${#fields.hasErrors(name)}" th:errors="*{__${name}__}">Error</p>
</div>

<!--/* Errors that are not tied to one field, e.g. a failed login. */-->
<div th:fragment="globalErrors" th:if="${#fields.hasGlobalErrors()}"
	class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900/60 dark:bg-red-950/40 dark:text-red-300" role="alert">
	<p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
</div>

<footer th:fragment="footer" class="mt-16 border-t border-slate-200 py-8 text-center text-sm text-slate-500">
	© Hulton Hotels · Your other home away from home
</footer>

</body>
</html>
