<!DOCTYPE html>
<html lang="en" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="flex min-h-full flex-col bg-slate-50 font-sans text-slate-800 antialiased">
<header th:replace="~{fragments/layout :: nav('home')}"></header>
<div th:replace="~{fragments/layout :: notice}"></div>

<main class="w-full flex-1 mx-auto max-w-6xl px-4 py-10">
	<h1 class="text-3xl font-bold tracking-tight text-slate-900" th:text="|Welcome back, ${customerName}!|">Welcome back!</h1>
	<p class="mt-2 text-slate-600">What would you like to do today?</p>

	<div class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
		<a th:href="@{/hotels}" class="card group transition hover:-translate-y-0.5 hover:border-brand-200 hover:shadow-md dark:hover:border-brand-700">
			<span class="grid size-10 place-items-center rounded-lg bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300">
				<svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.126 1.126 0 0 1 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/></svg>
			</span>
			<h2 class="mt-4 font-semibold text-slate-900 group-hover:text-brand-700 dark:group-hover:text-brand-300">Find a hotel</h2>
			<p class="mt-1 text-sm text-slate-500">Search hotels by date and reserve a room.</p>
		</a>
		<a th:href="@{/reservations}" class="card group transition hover:-translate-y-0.5 hover:border-brand-200 hover:shadow-md dark:hover:border-brand-700">
			<span class="grid size-10 place-items-center rounded-lg bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300">
				<svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>
			</span>
			<h2 class="mt-4 font-semibold text-slate-900 group-hover:text-brand-700 dark:group-hover:text-brand-300">My reservations</h2>
			<p class="mt-1 text-sm text-slate-500">See upcoming stays or cancel a booking.</p>
		</a>
		<a th:href="@{/review/history}" class="card group transition hover:-translate-y-0.5 hover:border-brand-200 hover:shadow-md dark:hover:border-brand-700">
			<span class="grid size-10 place-items-center rounded-lg bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300">
				<svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/></svg>
			</span>
			<h2 class="mt-4 font-semibold text-slate-900 group-hover:text-brand-700 dark:group-hover:text-brand-300">Leave a review</h2>
			<p class="mt-1 text-sm text-slate-500">Rate the rooms, breakfasts and services you used.</p>
		</a>
		<a th:href="@{/account/edit}" class="card group transition hover:-translate-y-0.5 hover:border-brand-200 hover:shadow-md dark:hover:border-brand-700">
			<span class="grid size-10 place-items-center rounded-lg bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300">
				<svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg>
			</span>
			<h2 class="mt-4 font-semibold text-slate-900 group-hover:text-brand-700 dark:group-hover:text-brand-300">Account</h2>
			<p class="mt-1 text-sm text-slate-500">Update your contact details and password.</p>
		</a>
	</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
